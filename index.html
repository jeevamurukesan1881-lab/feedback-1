<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Text Editor</title>
    <link rel="stylesheet" href="style.css">
    <meta name="google-site-verification" content="4Z9uOLNNgIAPOdQU4n6gcFNWVN26GkwzCfKE4ROsUtY" />
</head>
<body>
    <div class="main-container">
        <h1 class="title">LEAVE YOUR FEEDBACK</h1>
        <div class="input-wrapper">
            <textarea id="custom-textarea" maxlength="200" placeholder="Start typing..."></textarea>
            <div class="counter-box">
                <span id="current-count">0</span>/200 characters 
                (<span id="remaining-count">200</span> remaining)
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
